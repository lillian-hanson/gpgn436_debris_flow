# Run the verification suite, then publish the static site to GitHub Pages.
# The site is web/ plus a copy of solver/ (the worker fetches solver/*.py at runtime).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verification tests (Ritter, Stoker, steady Voellmy, mass conservation)
        run: |
          pip install numpy
          python tests/test_verification.py
      - name: Assemble site
        run: |
          mkdir _site
          cp -r web/* _site/
          mkdir _site/solver
          cp solver/*.py _site/solver/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
